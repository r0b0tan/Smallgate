memory_limit = 512M
; Sized for an uploaded draft (ADR 0004): 64 MB of ZIP plus the form. PHP
; reads the body before Laravel routes, so this holds for every request --
; nginx lets bodies this large through to the upload route only.
upload_max_filesize = 64M
post_max_size = 66M
max_execution_time = 60

; Never leak stack traces or file paths to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
