# =============================================================================
# MOCK -- LOCAL DEVELOPMENT ONLY. NOT A PRODUCTION BLUEPRINT.
# =============================================================================
#
# Serves preview directories under *.preview.localhost so the customer flow can
# be walked end to end on a laptop. It exists because the real delivery is not
# built yet -- see docs/adr/0001-preview-subdomain-architecture.md.
#
# Two deliberate simplifications, both unacceptable in production:
#
#   1. NO ACCESS CONTROL. Every preview is served to anyone who asks. Deciding
#      how the preview host authenticates the visitor is exactly the open
#      question ADR 0001 documents; this mock does not answer it and must not
#      be mistaken for an answer.
#   2. The subdomain label is mapped to a directory BY CONVENTION
#      (baenkle.preview.localhost -> /srv/previews/baenkle). The preview's
#      "target" column in the database is ignored -- a real implementation has
#      to look the hostname up and honour the stored, allow-listed target.
#
# Started on demand only: `docker compose --profile preview up -d preview`.

# Unknown hosts get nothing -- keeps the mock from answering for any name that
# happens to resolve here.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/preview.crt;
    ssl_certificate_key /etc/nginx/certs/preview.key;

    return 404;
}

server {
    listen 443 ssl;
    http2 on;

    # One label directly below preview.localhost, mirroring the rule that
    # App\Rules\PreviewHostname enforces against config('previews.base_domain').
    server_name ~^(?<preview_slug>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)\.preview\.localhost$;

    ssl_certificate     /etc/nginx/certs/preview.crt;
    ssl_certificate_key /etc/nginx/certs/preview.key;

    root /srv/previews/$preview_slug;
    index index.html;

    charset utf-8;
    absolute_redirect off;

    # A missing directory is a 404, never a directory listing.
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
